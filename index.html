<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#df1023"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css">
<title>بازارینو</title>
</head>
<body>
<div id="app">
<header class="top">
  <div class="topline"><button class="icon" id="menu">☰</button><div class="brand"><span>🛍️</span><b>بازارینو</b><small>خرید، مقایسه، فروش</small></div><button class="icon" id="bell">🔔</button></div>
  <label class="search">⌕<input id="search" placeholder="جستجوی کالا، برند یا مدل"></label>
</header>
<main id="screen"></main>
<nav class="nav">
 <button data-go="home" class="active">⌂<small>خانه</small></button>
 <button data-go="search">⌕<small>جستجو</small></button>
 <button data-go="sell" class="sell">＋<small>فروش</small></button>
 <button data-go="cart">🛒<small>سبد</small></button>
 <button data-go="profile">♙<small>حساب</small></button>
</nav>
<div id="drawer" class="drawer"><aside><div class="dhead"><div class="avatar">ع</div><b>علی محمدی</b><button id="close">×</button></div>
 <div class="dmenu">
  <button data-go="home">🏠 خانه</button><button data-go="search">🔎 جستجوی کالا</button><button data-go="categories">🗂 دسته‌بندی‌ها</button>
  <button data-go="orders">📦 سفارش‌های من</button><button data-go="favorites">♥ علاقه‌مندی‌ها</button><button data-go="seller">🏪 فروشگاه من</button>
  <button data-go="wallet">💳 کیف پول</button><button data-go="chat">💬 پیام‌ها</button><button data-go="admin">⚙️ مدیریت</button>
 </div></aside></div>
<div id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
